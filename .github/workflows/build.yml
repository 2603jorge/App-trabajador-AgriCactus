name: Build APK AgriCactus Trabajador

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev cmake libffi-dev \
            libssl-dev nasm

      - name: Install buildozer
        run: pip install buildozer cython

      - name: Setup Android SDK and licenses
        run: |
          SDK=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK/cmdline-tools
          curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mkdir -p $SDK/cmdline-tools/latest
          mv /tmp/cmdtools/cmdline-tools/* $SDK/cmdline-tools/latest/
          mkdir -p $SDK/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $SDK/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $SDK/licenses/android-sdk-license
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" >> $SDK/licenses/android-sdk-license
          $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK "build-tools;33.0.2" "platforms;android-33" "platform-tools"
          mkdir -p $SDK/tools/bin
          ln -sf $SDK/cmdline-tools/latest/bin/sdkmanager $SDK/tools/bin/sdkmanager
          java -version

     - name: Build APK
        run: |
          buildozer android debug 2>&1 | tee build_output.log || true
          echo "=== ULTIMAS 50 LINEAS ==="
          tail -50 build_output.log
          echo "=== ERRORES ==="
          grep -i "error\|exception\|failed\|traceback" build_output.log | grep -v "DEBUG\|test_" | tail -20
          ls -la bin/ 2>/dev/null || echo "No hay APK generado"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agricactus-trabajador-debug
          path: bin/*.apk
